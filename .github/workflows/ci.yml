name: CI Pipeline - Automated Build & Testing

# Triggers on code push or PR targeting the main branch, or manual dispatch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Suite (Unit, MockMvc, Pact, Testcontainers)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 Development Kit
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile source code
      - name: Compile Application
        run: mvn compile --batch-mode

      # Step 4: Execute automated tests (JUnit 5, MockMvc, Pact, Testcontainers)
      - name: Run Automated Tests
        run: mvn test --batch-mode

      # Step 5: Archive test results
      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
